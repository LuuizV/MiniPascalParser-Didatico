name: Importar fontes Electron
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fontes completas
        if: hashFiles('import-source.b64') != ''
        run: |
          base64 -d import-source.b64 > /tmp/minipascal-source.tar.xz
          tar -xJf /tmp/minipascal-source.tar.xz
          rm -f import-source.b64 .github/workflows/import-source.yml
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet || git commit -m "feat: migrar MiniPascal Studio para Electron v5.0.0"
          git push
