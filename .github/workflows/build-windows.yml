name: Windows - instalador, portatil e Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mini-pascal-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    name: Compilar e publicar release validada
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar regressao e sintaxe
        run: |
          npm run check
          npm test
      - name: Reservar Release como rascunho privado de publicacao
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $PSNativeCommandUseErrorActionPreference = $false
          $info = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json isDraft,assets 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            $release = $info | ConvertFrom-Json
            if ($release.isDraft -and @($release.assets).Count -eq 0) {
              Write-Host "Retomando rascunho sem artefatos: $tag"
              "publish=true" >> $env:GITHUB_OUTPUT
            } elseif (!$release.isDraft) {
              $required = @("MiniPascal-Setup-$version-x64.exe", "MiniPascal-Portable-$version-x64.exe", 'latest.yml', 'SHA256SUMS.txt')
              $assets = @($release.assets | ForEach-Object { $_.name })
              if (@($required | Where-Object { $assets -notcontains $_ }).Count -ne 0) { throw "Release $tag esta publica mas incompleta. Nao sobrescreva artefatos; corrija manualmente." }
              "publish=false" >> $env:GITHUB_OUTPUT
              Write-Host "Release $tag ja publicada e completa. Alteracoes futuras exigem nova versao."
            } else {
              throw "Rascunho $tag contem artefatos. Revise ou remova o rascunho incompleto antes de tentar novamente."
            }
          } else {
            gh release create $tag --draft --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "MiniPascal $tag - Windows" --notes "Release em preparacao. A publicacao ocorre somente apos validacao dos artefatos."
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar o rascunho da Release $tag." }
            "publish=true" >> $env:GITHUB_OUTPUT
          }
      - name: Preparar runtime Java incluido na distribuicao
        if: steps.version.outputs.publish == 'true'
        run: npm run java:runtime
      - name: Gerar icone Windows multirresolucao
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/generate-windows-icon.ps1
      - name: Compilar NSIS e portatil para o rascunho
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validar manifesto local e gerar SHA256
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $setup = "MiniPascal-Setup-$version-x64.exe"
          $portable = "MiniPascal-Portable-$version-x64.exe"
          foreach ($name in @($setup, $portable, 'latest.yml', "$setup.blockmap")) {
            if (!(Test-Path "dist/$name")) { throw "Falta artefato: $name" }
          }
          $manifest = Get-Content dist/latest.yml -Raw
          if (!$manifest.Contains("version: $version") -or !$manifest.Contains($setup) -or !$manifest.Contains('sha512:')) {
            throw 'latest.yml nao corresponde a versao, instalador e hash esperados.'
          }
          Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - name: Validar arquivos remotos e publicar de forma atomica
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "$env:RELEASE_TAG" dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao enviar hashes.' }
          $release = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json isDraft,assets | ConvertFrom-Json
          if (!$release.isDraft) { throw 'A Release ficou publica antes de completar a validacao.' }
          $version = node -p "require('./package.json').version"
          $setup = "MiniPascal-Setup-$version-x64.exe"
          $required = @($setup, "MiniPascal-Portable-$version-x64.exe", 'latest.yml', "$setup.blockmap", 'SHA256SUMS.txt')
          $assets = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in $required) {
            if ($assets -notcontains $name) { throw "O arquivo $name nao chegou ao GitHub. A Release permanece em rascunho." }
          }
          gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false --latest --title "MiniPascal $env:RELEASE_TAG - Windows" --notes "Versao Windows x64 validada. Inclui Setup NSIS com atualizacoes, Portable (manual), latest.yml, blockmap e hashes SHA256. Executaveis ainda nao assinados."
          if ($LASTEXITCODE -ne 0) { throw 'A Release permaneceu em rascunho: falha ao publicar.' }
          $after = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json isDraft | ConvertFrom-Json
          if ($after.isDraft) { throw 'Release ainda esta em rascunho.' }
      - name: Guardar artefatos
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MiniPascal-${{ steps.version.outputs.tag }}-Windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
