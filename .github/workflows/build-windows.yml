name: Windows - instalador, portable e Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mini-pascal-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    name: Compilar Windows x64 e publicar a versão
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar regressões e sintaxe
        run: |
          npm run check
          npm test
      - name: Verificar a Release e completar artefatos faltantes
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = node -p "require('./package.json').version"
          $tag = "v$v"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $PSNativeCommandUseErrorActionPreference = $false
          $assets = @(gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>$null)
          $exists = $LASTEXITCODE -eq 0
          $required = @("MiniPascal-Studio-Setup-$v-x64.exe", "MiniPascal-Studio-Portable-$v-x64.exe", "latest.yml", "SHA256SUMS.txt")
          $missing = @($required | Where-Object { $assets -notcontains $_ })
          if ($exists -and $missing.Count -eq 0) {
            "publish=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release completa: $tag. Para nova entrega incremente a versão."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
            if (-not $exists) {
              gh release create $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "MiniPascal Studio $tag - Windows" --notes "Instalador NSIS atualizável e versão portátil. Aplicativo sem assinatura digital." --latest
              if ($LASTEXITCODE -ne 0) { throw "Não foi possível criar a Release $tag." }
            } else {
              Write-Host "Release parcial detectada; completando arquivos faltantes: $($missing -join ', ')"
            }
          }
          exit 0
      - name: Compilar NSIS + portable e publicar latest.yml
        if: steps.version.outputs.publish == 'true'
        run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validar manifesto e calcular SHA256
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/latest.yml')) { throw 'latest.yml não foi gerado.' }
          if (!(Get-ChildItem dist/*Setup*.exe) -or !(Get-ChildItem dist/*Portable*.exe)) { throw 'Executáveis esperados ausentes.' }
          Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content 'dist/SHA256SUMS.txt' -Encoding utf8
      - name: Publicar hashes e finalizar Release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "$env:RELEASE_TAG" dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false --latest --title "MiniPascal Studio $env:RELEASE_TAG - Windows" --notes "Instalador NSIS atualizável por Releases. Portable com atualização manual. Sem assinatura digital."
      - name: Guardar artefatos
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MiniPascal-Studio-${{ steps.version.outputs.tag }}-Windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
