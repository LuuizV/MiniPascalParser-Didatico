name: Importar versão consolidada 5.2.0
on:
  push:
    branches: [main]
    paths:
      - '.import/v5.2.0.ready'
permissions:
  contents: write
  actions: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Verificar e extrair fontes
        shell: bash
        run: |
          set -euo pipefail
          cat .import/v5.2.0.part-* > /tmp/minipascal-v520.b64
          base64 --decode /tmp/minipascal-v520.b64 > /tmp/minipascal-v520.tar.xz
          echo "fce675e66cbac99fb85b225925280384abb506e94fb96190bbd5aaf6aa00637c  /tmp/minipascal-v520.tar.xz" | sha256sum --check
          tar -xJf /tmp/minipascal-v520.tar.xz
          rm -rf .import
          rm -f .github/workflows/import-v520.yml
      - name: Validar sintaxe e regressões antes de publicar
        run: |
          npm run check
          npm test
      - name: Publicar arquivos verificados na branch principal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: modernizacao integrada de IHC, arvore grafica e confiabilidade v5.2.0"
          git push origin HEAD:main
      - name: Disparar compilação Windows e Release v5.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh workflow run build-windows.yml --ref main
